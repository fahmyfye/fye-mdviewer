<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdview</title>
<link rel="stylesheet" href="/assets/github-markdown.css">
<link rel="stylesheet" href="/assets/hljs-github.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/assets/hljs-github-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/katex/katex.min.css">
<style>
  :root {
    --md-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --bar-bg: #f6f8fa; --bar-fg: #1f2328; --bar-border: #d0d7de;
    --btn-bg: #ffffff; --btn-border: #d0d7de;
    --accent: #1f883d; --accent-fg: #ffffff;
    --editor-bg: #ffffff; --editor-fg: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bar-bg: #161b22; --bar-fg: #e6edf3; --bar-border: #30363d;
      --btn-bg: #21262d; --btn-border: #30363d;
      --accent: #238636;
      --editor-bg: #0d1117; --editor-fg: #e6edf3;
    }
    body { background: #0d1117; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: auto 1fr; height: 100vh;
    font-family: var(--md-font);
    background: #ffffff;
  }

  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: var(--bar-bg); color: var(--bar-fg);
    border-bottom: 1px solid var(--bar-border);
    font-size: 13px; user-select: none;
  }
  .toolbar .name { font-weight: 600; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .toolbar .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; flex: none; }
  body.dirty .dot { background: #d29922; }
  .spacer { flex: 1; }

  .seg { display: inline-flex; border: 1px solid var(--btn-border); border-radius: 7px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: var(--btn-bg); color: inherit;
    padding: 5px 14px; font: inherit; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--btn-border); }
  .seg button.active { background: var(--accent); color: var(--accent-fg); }

  .btn {
    appearance: none; font: inherit; cursor: pointer;
    border: 1px solid var(--btn-border); background: var(--btn-bg); color: inherit;
    padding: 5px 12px; border-radius: 7px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  select.btn { padding-right: 6px; }

  main { overflow: hidden; min-height: 0; }
  .split { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  #editor {
    display: none;
    height: 100%; width: 100%; resize: none; border: 0; outline: 0;
    padding: 28px 24px; border-right: 1px solid var(--bar-border);
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--editor-bg); color: var(--editor-fg);
    tab-size: 4;
  }
  .preview-wrap { overflow: auto; height: 100%; }
  .markdown-body {
    box-sizing: border-box; max-width: 820px; margin: 0 auto; padding: 44px 28px;
    font-family: var(--md-font);
  }
  @media (prefers-color-scheme: dark) {
    .markdown-body { color-scheme: dark; }
    .preview-wrap { background: #0d1117; }
  }
  .markdown-body .mermaid { margin: 16px 0; text-align: center; overflow-x: auto; }
  .markdown-body .mermaid svg { max-width: 100%; height: auto; }
  .markdown-body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

  /* view mode: single centered column */
  body[data-mode="view"] .split { grid-template-columns: 1fr; }
  body[data-mode="view"] #editor { display: none; }
  /* edit mode: two panes */
  body[data-mode="edit"] .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  body[data-mode="edit"] #editor { display: block; }

  @media print {
    .toolbar { display: none; }
    body { display: block; height: auto; }
    main { overflow: visible; }
    .split { display: block; }
    #editor { display: none !important; }
    .preview-wrap { overflow: visible; height: auto; }
    .markdown-body { max-width: none; padding: 0; }
  }
</style>
</head>
<body data-mode="view">
  <div class="toolbar">
    <div class="name"><span class="dot"></span><span id="fname">document.md</span></div>
    <div class="seg" id="mode">
      <button data-mode="view" class="active">View</button>
      <button data-mode="edit">Edit</button>
    </div>
    <span class="spacer"></span>
    <label>Font
      <select class="btn" id="font">
        <option value='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>System</option>
        <option value='Georgia, "Times New Roman", serif'>Georgia</option>
        <option value='Charter, "Bitstream Charter", Georgia, serif'>Charter</option>
        <option value='"Helvetica Neue", Helvetica, Arial, sans-serif'>Helvetica</option>
        <option value='ui-monospace, Menlo, Consolas, monospace'>Mono</option>
      </select>
    </label>
    <button class="btn" id="print">Print / PDF</button>
    <button class="btn primary" id="save" disabled>Saved</button>
  </div>

  <main>
    <div class="split">
      <textarea id="editor" spellcheck="false"></textarea>
      <div class="preview-wrap"><article class="markdown-body" id="preview"></article></div>
    </div>
  </main>

<script src="/assets/marked.min.js"></script>
<script src="/assets/highlight.min.js"></script>
<script src="/assets/mermaid.min.js"></script>
<script src="/assets/katex/katex.min.js"></script>
<script src="/assets/katex/auto-render.min.js"></script>
<script>
(function () {
  var editor  = document.getElementById('editor');
  var preview = document.getElementById('preview');
  var saveBtn = document.getElementById('save');
  var body    = document.body;

  var darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: darkMode ? 'dark' : 'default'
    });
  }
  var mermaidSeq = 0;

  function renderExtras() {
    // Mermaid: marked emits <pre><code class="language-mermaid">
    var blocks = preview.querySelectorAll('code.language-mermaid, code.lang-mermaid');
    blocks.forEach(function (code) {
      var pre = code.closest('pre') || code;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + (++mermaidSeq);
      div.textContent = code.textContent;
      pre.replaceWith(div);
    });
    if (window.mermaid) {
      var nodes = preview.querySelectorAll('div.mermaid');
      if (nodes.length) {
        try { mermaid.run({ nodes: nodes, suppressErrors: true }); } catch (e) {}
      }
    }
    // KaTeX
    if (window.renderMathInElement) {
      try {
        renderMathInElement(preview, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false },
            { left: '$', right: '$', display: false }
          ],
          ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          throwOnError: false
        });
      } catch (e) {}
    }
  }
  var savedText = '';

  marked.setOptions({ gfm: true, breaks: false });

  function render() {
    preview.innerHTML = marked.parse(editor.value || '');
    preview.querySelectorAll('pre code').forEach(function (el) {
      if (el.classList.contains('language-mermaid') ||
          el.classList.contains('lang-mermaid')) return;
      try { hljs.highlightElement(el); } catch (e) {}
    });
    renderExtras();
  }
  var t;
  function scheduleRender() { clearTimeout(t); t = setTimeout(render, 200); }

  function setDirty(d) {
    body.classList.toggle('dirty', d);
    saveBtn.disabled = !d;
    saveBtn.textContent = d ? 'Save' : 'Saved';
  }

  // --- mode toggle ---
  var stored = null;
  try { stored = localStorage.getItem('mdview:mode'); } catch (e) {}
  setMode(stored === 'edit' ? 'edit' : 'view');

  document.getElementById('mode').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    setMode(b.dataset.mode);
  });
  function setMode(m) {
    body.dataset.mode = m;
    document.querySelectorAll('#mode button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === m);
    });
    try { localStorage.setItem('mdview:mode', m); } catch (e) {}
    if (m === 'edit') editor.focus();
  }

  // --- font ---
  var fontSel = document.getElementById('font');
  try {
    var f = localStorage.getItem('mdview:font');
    if (f) { fontSel.value = f; document.documentElement.style.setProperty('--md-font', f); }
  } catch (e) {}
  fontSel.addEventListener('change', function () {
    document.documentElement.style.setProperty('--md-font', fontSel.value);
    try { localStorage.setItem('mdview:font', fontSel.value); } catch (e) {}
  });

  // --- editing ---
  editor.addEventListener('input', function () {
    scheduleRender();
    setDirty(editor.value !== savedText);
  });
  editor.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '\t' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 1;
      editor.dispatchEvent(new Event('input'));
    }
  });

  // --- save ---
  function save() {
    if (editor.value === savedText) return;
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    fetch('/raw', { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: editor.value })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
      .then(function () { savedText = editor.value; setDirty(false); })
      .catch(function (err) {
        saveBtn.disabled = false; saveBtn.textContent = 'Retry save';
        alert('Save failed: ' + err.message);
      });
  }
  saveBtn.addEventListener('click', save);
  window.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (editor.value !== savedText) { e.preventDefault(); e.returnValue = ''; }
  });

  document.getElementById('print').addEventListener('click', function () { window.print(); });

  // --- load ---
  fetch('/meta').then(function (r) { return r.json(); }).then(function (m) {
    document.getElementById('fname').textContent = m.name;
    document.title = m.name + ' — mdview';
  });
  fetch('/raw').then(function (r) { return r.text(); }).then(function (text) {
    editor.value = text; savedText = text; render(); setDirty(false);
  });

  // --- keepalive so the local server knows the tab is open ---
  setInterval(function () { fetch('/ping').catch(function () {}); }, 4000);
})();
</script>
</body>
</html>
