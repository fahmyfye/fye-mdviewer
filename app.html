<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mdview</title>
<link rel="stylesheet" href="/assets/github-markdown.css">
<link rel="stylesheet" href="/assets/hljs-github.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/assets/hljs-github-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/katex/katex.min.css">
<style>
  :root {
    --md-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --bar-bg: #f6f8fa; --bar-fg: #1f2328; --bar-border: #d0d7de;
    --btn-bg: #ffffff; --btn-border: #d0d7de;
    --accent: #1f883d; --accent-fg: #ffffff;
    --editor-bg: #ffffff; --editor-fg: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bar-bg: #161b22; --bar-fg: #e6edf3; --bar-border: #30363d;
      --btn-bg: #21262d; --btn-border: #30363d;
      --accent: #238636;
      --editor-bg: #0d1117; --editor-fg: #e6edf3;
    }
    body { background: #0d1117; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: auto 1fr; height: 100vh;
    font-family: var(--md-font);
    background: #ffffff;
  }

  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: var(--bar-bg); color: var(--bar-fg);
    border-bottom: 1px solid var(--bar-border);
    font-size: 13px; user-select: none;
  }
  .toolbar .name { font-weight: 600; display: flex; align-items: center; gap: 7px; min-width: 0; }
  .toolbar .name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: transparent; flex: none; }
  body.dirty .dot { background: #d29922; }
  .spacer { flex: 1; }

  .seg { display: inline-flex; border: 1px solid var(--btn-border); border-radius: 7px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: var(--btn-bg); color: inherit;
    padding: 5px 14px; font: inherit; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--btn-border); }
  .seg button.active { background: var(--accent); color: var(--accent-fg); }

  .btn {
    appearance: none; font: inherit; cursor: pointer;
    border: 1px solid var(--btn-border); background: var(--btn-bg); color: inherit;
    padding: 5px 12px; border-radius: 7px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  #toc-toggle[aria-pressed="false"] { opacity: .5; }
  select.btn { padding-right: 6px; }

  main { overflow: hidden; min-height: 0; }
  .split { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  .editor-pane { display: none; position: relative; height: 100%; min-width: 0; }
  #editor {
    display: block;
    height: 100%; width: 100%; resize: none; border: 0; outline: 0;
    padding: 28px 24px; border-right: 1px solid var(--bar-border);
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--editor-bg); color: var(--editor-fg);
    tab-size: 4;
  }

  /* find & replace (edit mode) */
  #find {
    position: absolute; top: 6px; right: 14px; z-index: 5;
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px; border: 1px solid var(--bar-border); border-radius: 8px;
    background: var(--bar-bg); box-shadow: 0 6px 20px rgba(0, 0, 0, .22);
    font-size: 12px;
  }
  #find .row { display: flex; align-items: center; gap: 4px; }
  #find input {
    width: 150px; padding: 4px 6px; font: inherit;
    border: 1px solid var(--btn-border); border-radius: 5px;
    background: var(--btn-bg); color: inherit;
  }
  #find .row:nth-child(2) input { flex: 1; width: auto; }
  #find button {
    appearance: none; font: inherit; cursor: pointer; line-height: 1;
    padding: 4px 7px; border: 1px solid var(--btn-border); border-radius: 5px;
    background: var(--btn-bg); color: inherit;
  }
  #find button.on { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  #find .count {
    min-width: 46px; text-align: center; opacity: .6;
    font-variant-numeric: tabular-nums;
  }

  .preview-wrap { overflow: auto; height: 100%; }
  .markdown-body {
    box-sizing: border-box; max-width: 820px; margin: 0 auto; padding: 44px 28px;
    font-family: var(--md-font);
  }
  .markdown-body :is(h1, h2, h3, h4, h5, h6) { scroll-margin-top: 14px; }
  @media (prefers-color-scheme: dark) {
    .markdown-body { color-scheme: dark; }
    .preview-wrap { background: #0d1117; }
  }
  .markdown-body .mermaid { margin: 16px 0; text-align: center; overflow-x: auto; }
  .markdown-body .mermaid svg { max-width: 100%; height: auto; }
  .markdown-body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }

  /* table of contents (view mode only) */
  #toc {
    display: none;
    overflow-y: auto; height: 100%;
    padding: 26px 14px 40px 18px;
    border-right: 1px solid var(--bar-border);
    background: var(--bar-bg);
    font-size: 13px; line-height: 1.45;
    -webkit-user-select: none; user-select: none;
  }
  #toc-title {
    margin: 0 0 8px 8px; font-size: 11px; font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase; opacity: .5;
  }
  #toc ul { list-style: none; margin: 0; padding: 0; }
  #toc a {
    display: block; padding: 3px 8px; border-radius: 5px;
    border-left: 2px solid transparent;
    color: var(--bar-fg); opacity: .72; text-decoration: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toc a:hover { opacity: 1; background: var(--btn-bg); }
  #toc a.active {
    opacity: 1; font-weight: 600;
    color: var(--accent); border-left-color: var(--accent);
  }
  #toc a.lvl-2 { padding-left: 20px; }
  #toc a.lvl-3 { padding-left: 34px; font-size: 12px; }

  /* view mode: single centered column, + optional TOC */
  body[data-mode="view"] .split { grid-template-columns: 1fr; }
  body[data-mode="view"] .editor-pane { display: none; }
  body[data-mode="view"]:not(.no-toc) .split.has-toc { grid-template-columns: 244px minmax(0, 1fr); }
  body[data-mode="view"]:not(.no-toc) .split.has-toc #toc { display: block; }
  /* edit mode: two panes */
  body[data-mode="edit"] .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  body[data-mode="edit"] .editor-pane { display: block; }
  body[data-mode="edit"] #toc { display: none !important; }

  @media print {
    .toolbar { display: none; }
    body { display: block; height: auto; }
    main { overflow: visible; }
    .split { display: block; }
    .editor-pane, #toc { display: none !important; }
    .preview-wrap { overflow: visible; height: auto; }
    .markdown-body { max-width: none; padding: 0; }
  }
</style>
</head>
<body data-mode="view">
  <div class="toolbar">
    <div class="name"><span class="dot"></span><span id="fname">document.md</span></div>
    <div class="seg" id="mode">
      <button data-mode="view" class="active">View</button>
      <button data-mode="edit">Edit</button>
    </div>
    <span class="spacer"></span>
    <label>Font
      <select class="btn" id="font">
        <option value='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>System</option>
        <option value='Georgia, "Times New Roman", serif'>Georgia</option>
        <option value='Charter, "Bitstream Charter", Georgia, serif'>Charter</option>
        <option value='"Helvetica Neue", Helvetica, Arial, sans-serif'>Helvetica</option>
        <option value='ui-monospace, Menlo, Consolas, monospace'>Mono</option>
      </select>
    </label>
    <button class="btn" id="toc-toggle" aria-pressed="true" hidden>Contents</button>
    <button class="btn" id="docx">DOCX</button>
    <button class="btn" id="print">Print / PDF</button>
    <button class="btn primary" id="save" disabled>Saved</button>
  </div>

  <main>
    <div class="split">
      <nav id="toc" aria-label="Table of contents"></nav>
      <div class="editor-pane">
        <textarea id="editor" spellcheck="false"></textarea>
        <div id="find" hidden>
          <div class="row">
            <input id="find-q" type="text" placeholder="Find" spellcheck="false" autocomplete="off">
            <span class="count" id="find-count">0/0</span>
            <button id="find-prev" title="Previous (Shift+Enter)">&uarr;</button>
            <button id="find-next" title="Next (Enter)">&darr;</button>
            <button id="find-case" title="Match case">Aa</button>
            <button id="find-close" title="Close (Esc)">&#10005;</button>
          </div>
          <div class="row">
            <input id="find-r" type="text" placeholder="Replace" spellcheck="false" autocomplete="off">
            <button id="find-rep" title="Replace (Enter)">Replace</button>
            <button id="find-repall">All</button>
          </div>
        </div>
      </div>
      <div class="preview-wrap"><article class="markdown-body" id="preview"></article></div>
    </div>
  </main>

<script src="/assets/marked.min.js"></script>
<script src="/assets/highlight.min.js"></script>
<script src="/assets/mermaid.min.js"></script>
<script src="/assets/katex/katex.min.js"></script>
<script src="/assets/katex/auto-render.min.js"></script>
<script>
(function () {
  var editor  = document.getElementById('editor');
  var preview = document.getElementById('preview');
  var saveBtn = document.getElementById('save');
  var body    = document.body;
  var toc       = document.getElementById('toc');
  var tocToggle = document.getElementById('toc-toggle');
  var previewWrap = document.querySelector('.preview-wrap');
  var split = document.querySelector('.split');
  var findBar   = document.getElementById('find');
  var findQ     = document.getElementById('find-q');
  var findR     = document.getElementById('find-r');
  var findCount = document.getElementById('find-count');
  var findCase  = document.getElementById('find-case');
  var fMatches  = [];
  var fIdx      = -1;
  var fCase     = false;

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function slugify(text, used) {
    var base = text.toLowerCase().trim()
      .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-') || 'section';
    var slug = base, n = 1;
    while (used[slug]) slug = base + '-' + (n++);
    used[slug] = true;
    return slug;
  }

  var tocLinks = [];
  function buildTOC() {
    var headings = preview.querySelectorAll('h1, h2, h3');
    if (!headings.length) {
      split.classList.remove('has-toc');
      toc.innerHTML = '';
      tocLinks = [];
      refreshTocToggle();
      return;
    }
    var used = {};
    var html = '<p id="toc-title">Contents</p><ul>';
    headings.forEach(function (h) {
      if (h.id) used[h.id] = true;
      else h.id = slugify(h.textContent, used);
      html += '<li><a class="lvl-' + h.tagName[1] + '" href="#' + h.id + '">' +
              escapeHtml(h.textContent) + '</a></li>';
    });
    toc.innerHTML = html + '</ul>';
    split.classList.add('has-toc');
    tocLinks = [].slice.call(toc.querySelectorAll('a'));
    tocLinks.forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var el = document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));
        if (!el) return;
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setActiveLink(a);            // short docs may not scroll far enough for the spy
      });
    });
    refreshTocToggle();
    updateActiveHeading();
  }

  function setActiveLink(link) {
    tocLinks.forEach(function (a) { a.classList.toggle('active', a === link); });
  }

  var spyTimer;
  function updateActiveHeading() {
    if (!tocLinks.length) return;
    var limit = previewWrap.getBoundingClientRect().top + 90;
    var currentId = null;
    preview.querySelectorAll('h1, h2, h3').forEach(function (h) {
      if (h.getBoundingClientRect().top <= limit) currentId = h.id;
    });
    tocLinks.forEach(function (a) {
      a.classList.toggle('active',
        decodeURIComponent(a.getAttribute('href').slice(1)) === currentId);
    });
  }
  previewWrap.addEventListener('scroll', function () {
    clearTimeout(spyTimer);
    spyTimer = setTimeout(updateActiveHeading, 60);
  });

  function refreshTocToggle() {
    tocToggle.hidden = (body.dataset.mode !== 'view' || !tocLinks.length);
  }

  var darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: darkMode ? 'dark' : 'default'
    });
  }
  var mermaidSeq = 0;

  function renderExtras() {
    // Mermaid: marked emits <pre><code class="language-mermaid">
    var blocks = preview.querySelectorAll('code.language-mermaid, code.lang-mermaid');
    blocks.forEach(function (code) {
      var pre = code.closest('pre') || code;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.id = 'mmd-' + (++mermaidSeq);
      div.textContent = code.textContent;
      pre.replaceWith(div);
    });
    if (window.mermaid) {
      var nodes = preview.querySelectorAll('div.mermaid');
      if (nodes.length) {
        try { mermaid.run({ nodes: nodes, suppressErrors: true }); } catch (e) {}
      }
    }
    // KaTeX
    if (window.renderMathInElement) {
      try {
        renderMathInElement(preview, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false },
            { left: '$', right: '$', display: false }
          ],
          ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          throwOnError: false
        });
      } catch (e) {}
    }
  }
  var savedText = '';

  marked.setOptions({ gfm: true, breaks: false });

  function render() {
    preview.innerHTML = marked.parse(editor.value || '');
    preview.querySelectorAll('pre code').forEach(function (el) {
      if (el.classList.contains('language-mermaid') ||
          el.classList.contains('lang-mermaid')) return;
      try { hljs.highlightElement(el); } catch (e) {}
    });
    renderExtras();
    buildTOC();
  }
  var t;
  function scheduleRender() { clearTimeout(t); t = setTimeout(render, 200); }

  function setDirty(d) {
    body.classList.toggle('dirty', d);
    saveBtn.disabled = !d;
    saveBtn.textContent = d ? 'Save' : 'Saved';
  }

  // --- mode toggle ---
  var stored = null;
  try { stored = localStorage.getItem('mdview:mode'); } catch (e) {}
  setMode(stored === 'edit' ? 'edit' : 'view');

  document.getElementById('mode').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    setMode(b.dataset.mode);
  });
  function setMode(m) {
    body.dataset.mode = m;
    document.querySelectorAll('#mode button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === m);
    });
    try { localStorage.setItem('mdview:mode', m); } catch (e) {}
    refreshTocToggle();
    if (m === 'edit') editor.focus();
    else { closeFind(); setTimeout(updateActiveHeading, 0); }
  }

  // --- contents toggle ---
  try {
    if (localStorage.getItem('mdview:toc') === 'off') body.classList.add('no-toc');
  } catch (e) {}
  tocToggle.setAttribute('aria-pressed', String(!body.classList.contains('no-toc')));
  tocToggle.addEventListener('click', function () {
    var hidden = body.classList.toggle('no-toc');
    tocToggle.setAttribute('aria-pressed', String(!hidden));
    try { localStorage.setItem('mdview:toc', hidden ? 'off' : 'on'); } catch (e) {}
    if (!hidden) setTimeout(updateActiveHeading, 0);
  });

  // --- font ---
  var fontSel = document.getElementById('font');
  try {
    var f = localStorage.getItem('mdview:font');
    if (f) { fontSel.value = f; document.documentElement.style.setProperty('--md-font', f); }
  } catch (e) {}
  fontSel.addEventListener('change', function () {
    document.documentElement.style.setProperty('--md-font', fontSel.value);
    try { localStorage.setItem('mdview:font', fontSel.value); } catch (e) {}
  });

  // --- editing ---
  editor.addEventListener('input', function () {
    scheduleRender();
    setDirty(editor.value !== savedText);
  });
  editor.addEventListener('keydown', function (e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      var s = editor.selectionStart, en = editor.selectionEnd;
      editor.value = editor.value.slice(0, s) + '\t' + editor.value.slice(en);
      editor.selectionStart = editor.selectionEnd = s + 1;
      editor.dispatchEvent(new Event('input'));
    }
  });

  // --- save ---
  function save() {
    if (editor.value === savedText) return;
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    fetch('/raw', { method: 'PUT', headers: { 'Content-Type': 'text/plain' }, body: editor.value })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); })
      .then(function () { savedText = editor.value; setDirty(false); })
      .catch(function (err) {
        saveBtn.disabled = false; saveBtn.textContent = 'Retry save';
        alert('Save failed: ' + err.message);
      });
  }
  saveBtn.addEventListener('click', save);
  window.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (editor.value !== savedText) { e.preventDefault(); e.returnValue = ''; }
  });

  document.getElementById('print').addEventListener('click', function () { window.print(); });

  // --- DOCX export (server-side pandoc) ---
  var docxBtn = document.getElementById('docx');
  var docxName = 'document.docx';
  docxBtn.addEventListener('click', function () {
    var label = docxBtn.textContent;
    docxBtn.disabled = true; docxBtn.textContent = 'Exporting…';
    fetch('/export.docx', {
      method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: editor.value
    }).then(function (r) {
      if (r.status === 501) {
        return r.text().then(function (msg) { throw new Error(msg); });
      }
      if (!r.ok) return r.text().then(function (msg) { throw new Error(msg || ('HTTP ' + r.status)); });
      return r.blob();
    }).then(function (blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = docxName;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    }).catch(function (err) {
      alert('DOCX export failed:\n\n' + err.message);
    }).then(function () {
      docxBtn.disabled = false; docxBtn.textContent = label;
    });
  });

  // --- load ---
  fetch('/meta').then(function (r) { return r.json(); }).then(function (m) {
    document.getElementById('fname').textContent = m.name;
    document.title = m.name + ' — mdview';
    docxName = m.name.replace(/\.(md|markdown|mdown|mkd)$/i, '') + '.docx';
    if (!m.docx) docxBtn.title = 'Install pandoc for DOCX export:  brew install pandoc';
  });
  fetch('/raw').then(function (r) { return r.text(); }).then(function (text) {
    editor.value = text; savedText = text; render(); setDirty(false);
  });

  // --- find & replace (editor only) ---
  function openFind() {
    if (body.dataset.mode !== 'edit') return;
    findBar.hidden = false;
    var sel = editor.value.substring(editor.selectionStart, editor.selectionEnd);
    if (sel && sel.indexOf('\n') === -1) findQ.value = sel;
    findQ.focus(); findQ.select();
    scanFind(true);
  }
  function closeFind() {
    if (findBar.hidden) return;
    findBar.hidden = true;
    if (body.dataset.mode === 'edit') editor.focus();
  }
  function scanFind(jump) {
    fMatches = [];
    var needle = findQ.value;
    if (needle) {
      var hay = fCase ? editor.value : editor.value.toLowerCase();
      var pin = fCase ? needle : needle.toLowerCase();
      var from = 0, at;
      while ((at = hay.indexOf(pin, from)) !== -1) {
        fMatches.push([at, at + pin.length]);
        from = at + pin.length;
      }
    }
    if (!fMatches.length) { fIdx = -1; findCount.textContent = '0/0'; return; }
    if (fIdx < 0 || fIdx >= fMatches.length) fIdx = 0;
    if (jump) selectFind(); else paintCount();
  }
  function paintCount() {
    findCount.textContent = fMatches.length ? (fIdx + 1) + '/' + fMatches.length : '0/0';
  }
  function selectFind() {
    if (fIdx < 0 || fIdx >= fMatches.length) return;
    var m = fMatches[fIdx];
    editor.focus();
    editor.setSelectionRange(m[0], m[1]);
    var line = editor.value.slice(0, m[0]).split('\n').length - 1;
    var lh = parseFloat(getComputedStyle(editor).lineHeight) || 20;
    editor.scrollTop = Math.max(0, line * lh - editor.clientHeight / 2);
    paintCount();
    findQ.focus();
  }
  function stepFind(delta) {
    if (!fMatches.length) { scanFind(true); return; }
    fIdx = (fIdx + delta + fMatches.length) % fMatches.length;
    selectFind();
  }
  function replaceFind() {
    if (fIdx < 0 || fIdx >= fMatches.length) { stepFind(1); return; }
    var m = fMatches[fIdx];
    editor.value = editor.value.slice(0, m[0]) + findR.value + editor.value.slice(m[1]);
    editor.dispatchEvent(new Event('input'));
    var caret = m[0] + findR.value.length;
    scanFind(false);
    fIdx = -1;
    for (var k = 0; k < fMatches.length; k++) {
      if (fMatches[k][0] >= caret) { fIdx = k; break; }
    }
    if (fIdx === -1 && fMatches.length) fIdx = 0;
    if (fMatches.length) selectFind(); else findCount.textContent = '0/0';
  }
  function replaceAllFind() {
    scanFind(false);
    if (!fMatches.length) return;
    var out = '', last = 0;
    fMatches.forEach(function (m) { out += editor.value.slice(last, m[0]) + findR.value; last = m[1]; });
    out += editor.value.slice(last);
    var n = fMatches.length;
    editor.value = out;
    editor.dispatchEvent(new Event('input'));
    fMatches = []; fIdx = -1;
    findCount.textContent = 'replaced ' + n;
  }

  findQ.addEventListener('input', function () { fIdx = 0; scanFind(true); });
  findQ.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  });
  findR.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); replaceFind(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  });
  document.getElementById('find-next').addEventListener('click', function () { stepFind(1); });
  document.getElementById('find-prev').addEventListener('click', function () { stepFind(-1); });
  document.getElementById('find-rep').addEventListener('click', replaceFind);
  document.getElementById('find-repall').addEventListener('click', replaceAllFind);
  document.getElementById('find-close').addEventListener('click', closeFind);
  findCase.addEventListener('click', function () {
    fCase = !fCase;
    findCase.classList.toggle('on', fCase);
    fIdx = 0; scanFind(true);
  });

  window.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
      if (body.dataset.mode !== 'edit') return;  // view mode: leave native Cmd+F alone
      e.preventDefault();
      openFind();
    }
  });

  // --- keepalive so the local server knows the tab is open ---
  setInterval(function () { fetch('/ping').catch(function () {}); }, 4000);
})();
</script>
